function save(action,detail){db.audit.unshift({action,detail,user:role,time:new Date().toLocaleTimeString('es-PY',{hour:'2-digit',minute:'2-digit'})});localStorage.setItem('helitactica-demo-v1',JSON.stringify(db))}function toast(t){document.querySelector('#notifications').innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>document.querySelector('#notifications').innerHTML='',3500)}function mine(items){return role==='Gerencia Comercial'?items:items.filter(x=>x.seller===role)}function filter(items){return mine(items).filter(x=>(service==='Todos los servicios'||x.service===service)&&(!search||JSON.stringify(x).toLowerCase().includes(search.toLowerCase())))}function go(v){view=v;search='';service='Todos los servicios';document.body.classList.remove('menuopen');render()}function pill(t){return `<span class="pill ${['Pendiente','Cotizada','Enviada','Suspendida'].includes(t)?'orange':['En atención','Patrullaje'].includes(t)?'blue':['Perdida','Cancelada','Finalizada'].includes(t)?'gray':''}">${esc(t)}</span>`}function button(label,fn,style='',ico=''){return `<button class="btn ${style}" onclick="${fn}">${ico?icon(ico):''}${label}</button>`}function person(name,sub=''){return `<div class="person"><span class="avatar">${esc(initials(name))}</span><div>${esc(name)}${sub?`<small>${esc(sub)}</small>`:''}</div></div>`}function head(title,desc,action=''){return `<div class="pagehead"><div><div class="eyebrow">${view==='fire'?'Operaciones aéreas':'Helitáctica / Gestión comercial'}</div><h1>${title}</h1><div class="sub">${desc}</div></div><div class="actions">${action}</div></div>`}function card(label,value,note,ico='chart',feature=false){return `<div class="card ${feature?'feature':''}"><div class="label">${label}${icon(ico)}</div><div class="value">${value}</div><small>${note}</small></div>`}function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${hea function dashboard(){let deals=mine(db.deals),won=deals.filter(d=>d.stage==='Ganada'),total=won.reduce((a,d)=>a+d.amount,0);return head(role==='Gerencia Comercial'?'Visión general':'Mi espacio comercial','Cada consulta, cada oportunidad y cada operación. En un solo lugar.',button('Exportar informe',"exportData('comercial')",'','download'))+`<div class="toolbar"><span class="pill">Noviembre 2026 · Datos de ejemplo</span><span class="right mini"><span class="signal" style="background:#7ba156"></span>Vista de ${esc(role)}</span></div><div class="cards">${card('Conversaciones visibles',mine(db.chats).length,'Bandeja de demostración','chat')}${card('Cotizaciones emitidas',mine(db.quotes).length,money(mine(db.quotes).reduce((a,d)=>a+d.amount,0))+' cotizados','doc')}${card('Ventas concretadas',won.length,'Sobre '+deals.length+' oportunidades','pipeline')}${card('Ventas registradas',money(total),'Importes de ventas ganadas','chart',true)}</div><div class="grid"><section class="panel"><div class="panelhead"><div><h2>Actividad comercial</h2><div class="mini">Tendencia ilustrativa del mes</div></div><div class="legend"><span><i class="dot" style="background:#fe5a25"></i>Consultas</span><span><i class="dot" style="background:#b6b8ba"></i>Cotizaciones</span></div></div>${chart()}</section><section class="panel"><div class="panelhead"><h2>Consultas por servicio</h2><span class="mini">Distribución ilustrativa</span></div><div class="donutbox"><div class="donut"><span>180<small>CONSULTAS</small></span></div><div class="servicelist">${[['Taxi Aéreo','43%','#575a5b'],['Escuela','29%','#fe5a25'],['Experiencias','18%','#c5c8ca'],['Incendios','10%','#fe9677']].map(x=>`<p><span><i class="dot" style="background:${x[2]}"></i>${x[0]}</span><b>${x[1]}</b></p>`).join('')}</div></div></section></div><div class="strip">${icon('clock')}<div><strong>La próxima oportunidad está en el seguimiento.</strong><br>${mine(db.tasks).filter(t=>!t.done).length} tareas pendientes · ${role==='Gerencia Comerci function inbox(){let visible=db.chats.map((c,i)=>({...c,id:i})).filter(c=>role==='Gerencia Comercial'||c.seller===role);if(!visible.some(c=>c.id===selected))selected=visible[0]?.id??-1;let c=db.chats[selected];return head('Bandeja de WhatsApp','Una línea corporativa. Un historial compartido. Atención coordinada.',button('Simular consulta',"simulate()",'primary','plus'))+`<div class="inbox"><div class="threads"><div style="padding:17px;border-bottom:1px solid var(--line)"><b>Conversaciones</b> <span class="pill">${visible.length}</span><div class="mini" style="margin-top:5px">Línea corporativa · Simulación</div></div>${visible.map(c=>`<div role="button" tabindex="0" onkeydown="if(event.key==='Enter'){selected=${c.id};render()}" class="thread ${c.id===selected?'selected':''}" onclick="selected=${c.id};render()"><div style="display:flex;justify-content:space-between"><strong>${esc(c.name)}</strong><small>10:24</small></div><p>${esc(c.messages.at(-1).text).slice(0,65)}…</p>${pill(c.status)} <small class="mini">${esc(c.service)}</small></div>`).join('')}</div>${c?`<div class="chat"><div class="chathead"><div>${person(c.name,c.company)}</div><span class="pill ${c.expired?'orange':''}">${c.expired?'Requiere plantilla':'Ventana activa · Demo'}</span></div><div class="messages"><div class="mini" style="text-align:center;margin-bottom:20px">8 NOVIEMBRE 2026 · CONVERSACIÓN SIMULADA</div>${c.messages.map(m=>`<div class="message ${m.out?'out':''}">${esc(m.text)}<small>${m.out?esc(m.author||'Cristian Villalba')+' · ':''}10:24 ${m.out?'✓✓':''}</small></div>`).join('')}</div><form class="composer" onsubmit="sendMessage(event)">${c.expired?button('Enviar plantilla de seguimiento',"templateMessage()",'primary'): '<input id="message" aria-label="Escribir mensaje" placeholder="Escribí una respuesta…" required><button class="btn primary" type="submit">Enviar</button>'}</form></div><div class="contactdetail"><div class="eyebrow">Ficha del contacto</div><h3>${esc(c.company)}</h3><div clas function clients(){return head('Clientes','Relaciones duraderas, información centralizada y oportunidades conectadas.',button('Nuevo cliente',"modal('client')",'primary','plus'))+toolbar()+`<section class="panel">${table(['Cliente / contacto','Servicio','Asesor responsable','Oportunidades','Acción'],filter(db.clients).map(c=>row([person(c.name,c.contact),pill(c.service),esc(c.seller),db.deals.filter(d=>d.client===c.name).length,button('Ver ficha',`clientDetail(${db.clients.indexOf(c)})`,'small')])) )}</section>`}function clientDetail(i){let c=db.clients[i];showModal(`<h2>${esc(c.name)}</h2><p class="sub">Ficha de cliente · ${esc(c.contact)}</p><div class="permission">${esc(c.email)}<br>${esc(c.service)} · ${esc(c.seller)}</div><h3>Historial comercial</h3>${db.deals.filter(d=>d.client===c.name).map(d=>`<div class="flightline"><div><b>${esc(d.name)}</b><br><small>${money(d.amount)} · ${esc(d.aircraft)}</small></div>${pill(d.stage)}</div>`).join('')||'<p class="sub">Sin oportunidades registradas.</p>'}<div style="margin-top:20px">${button('Cerrar','closeModal()')}</div>`)}

function approveQuote(i){let q=db.quotes[i];if(role!=='Gerencia Comercial'){save('Aprobación solicitada',q.number);toast('Solicitud registrada para gerencia');return}if(q.status!=='Aprobada'){q.status='Aprobada';save('Cotización aprobada',q.number);toast('Cotización aprobada')}else{showModal(`<h2>Registrar facturación</h2><p class="sub">${esc(q.number)} · ${money(q.amount)}</p><form onsubmit="event.preventDefault();db.quotes[${i}].invoiced=this.invoice.value;save('Factura externa registrada',this.invoice.value);closeModal();render()"><div class="field" style="margin:20px 0"><label>Número de factura externa</label><input name="invoice" required></div><button class="btn primary">Registrar factura</button></form>`);return}render()}

function tasks(){let ts=mine(db.tasks);return head('Seguimientos','La próxima acción siempre tiene un responsable y una fecha.',button('Programar seguimiento',"modal('task')",'primary','plus'))+`<div class="cards">${card('Pendientes',ts.filter(t=>!t.done).length,'Acciones por completar','calendar')}${card('Vencidos',ts.filter(t=>!t.done&&t.date<'2026-11-08').length,'Requieren atención','clock')}${card('Para hoy',ts.filter(t=>t.date==='2026-11-08'&&!t.done).length,'08 de noviembre de 2026','doc')}${card('Completados',ts.filter(t=>t.done).length,'Actividad registrada','check',true)}</div><section class="panel">${table(['Seguimiento','Cliente','Responsable','Vencimiento','Estado','Acción'],ts.map(t=>row([`<b>${esc(t.name)}</b>`,esc(t.client),esc(t.seller),esc(t.date),pill(t.done?'Completado':t.date<'2026-11-08'?'Pendiente':'Programado'),t.done?'—':button('Completar',`completeTask(${db.tasks.indexOf(t)})`,'small')])) )}</section>`}function completeTask(i){db.tasks[i].done=true;save('Seguimiento completado',db.tasks[i].name);render();toast('Seguimiento completado')}
function fire(){let fs=db.flights,combat=fs.filter(f=>f.activity==='Combate'),sum=(arr,k)=>arr.reduce((a,f)=>a+Number(f[k]||0),0),hours=n=>(n/60).toFixed(1),c=db.campaigns[0];return head('Combate aéreo de incendios','Campañas, aeronaves y operaciones. Trazabilidad desde la base hasta cada descarga.',button('Nueva campaña',"modal('campaign')",'','plus')+button('Registrar operación',"modal('flight')",'primary','plus'))+`<div class="campaignhero"><div><span class="pill">${esc(c.status)} · CAMPAÑA HT-C01</span><h2>${esc(c.name)}</h2><div class="sub">${esc(c.client)} · ${esc(c.location)}</div><div class="mini" style="color:#b4b9bc;margin-top:12px">${esc(c.start)} → ${esc(c.end)} &nbsp; | &nbsp; Guardia: 07:00 – 18:00</div></div><svg class="campmap" viewBox="0 0 190 130" fill="none" aria-label="Ilustración de cobertura operativa"><path d="M15 25 65 6 102 25 152 12 178 48 156 79 170 112 112 124 70 101 22 109 8 65Z" stroke="#c0c4c6" stroke-dasharray="4 4"/><circle cx="90" cy="62" r="45" stroke="#fe5a25" opacity=".3"/><circle cx="90" cy="62" r="28" stroke="#fe5a25" opacity=".6"/><circle cx="90" cy="62" r="7" fill="#fe5a25"/><path d="M90 62 134 35M90 62 53 91" stroke="#fe5a25"/><circle cx="134" cy="35" r="4" fill="#fe5a25"/><circle cx="53" cy="91" r="4" fill="#fe5a25"/></svg></div><div class="sectionnav">${['Resumen','Bitácora de vuelo','Recursos y campañas','Documentación'].map(t=>`<button class="${firetab===t?'active':''}" onclick="firetab='${t}';render()">${t}</button>`).join('')}</div>${firetab==='Resumen'?`<div class="cards">${card('Horas de combate',hours(sum(combat,'mins'))+' h','Solo combate efectivo','fire')}${card('Vuelos técnicos y vigilancia',hours(sum(fs.filter(f=>f.activity!=='Combate'),'mins'))+' h','Excluidos del combate efectivo','plane')}${card('Lanzamientos',sum(fs,'drops'),sum(fs,'liters').toLocaleString('es-PY')+' litros descargados','chart')}${card('Distancia recorrida',sum(fs,'distance')+' NM','Millas náuticas registradas','plane',true)}</div><div class="grid"><section class="panel"><div class="panelhead"><h2>Últimas operaciones</h2>${button('Ver bitácora',"firetab='Bitácora de vuelo';render()",'small')}</div>${fs.slice().reverse().slice(0,5).map(f=>`<div class="flightline">${icon(f.activity==='Combate'?'fire':'plane')}<div><b>${esc(f.aircraft)} · ${esc(f.zone)}</b><br><small>${esc(f.date)} · ${esc(f.start)} – ${esc(f.end)} · ${f.mins} min</small></div>${pill(f.activity)}</div>`).join('')}</section><section class="panel"><div class="panelhead"><h2>Indicadores de campaña</h2></div><div class="metriclist" style="grid-template-columns:1fr 1fr">${[[new Set(fs.filter(f=>f.mins>0).map(f=>f.date)).size,'Días con vuelos'],[fs.filter(f=>f.activity==='Guardia sin vuelo').length,'Jornadas sin vuelos'],[fs.filter(f=>f.outside).length,'Fuera de guardia'],[new Set(fs.map(f=>f.zone)).size,'Zonas atendidas']].map(a=>`<div class="metricbox"><b>${a[0]}</b><small>${a[1]}</small></div>`).join('')}</div><p class="mini">Indicadores calculados a partir de los registros cargados en esta demostración.</p>${button('Informe de campaña',"exportData('incendios')",'small','download')}</section></div>`:firetab==='Bitácora de vuelo'?`<section class="panel"><div class="panelhead"><h2>Registro diario de operaciones</h2>${button('Exportar CSV',"exportData('incendios')",'small','download')}</div>${table(['Fecha','Aeronave / piloto','Actividad','Zona','Inicio / fin','Vuelo','NM','Descargas / litros','Guardia'],fs.map(f=>row([esc(f.date),person(f.aircraft,f.pilot),pill(f.activity),esc(f.zone),esc(f.start)+' – '+esc(f.end),f.mins+' min',f.distance,f.drops+' / '+Number(f.liters).toLocaleString('es-PY')+' L',pill(f.outside?'Fuera de horario':'En horario')])) )}</section>`:firetab==='Recursos y campañas'?`<div class="twocol"><section class="panel"><h2>Expedientes de campaña</h2>${db.campaigns.map((c,i)=>`<div class="flightline"><div><b>${esc(c.name)}</b><br><small>${esc(c.client)} · ${esc(c.start)} / ${esc(c.end)}</small><br><small>${esc(c.location)}</small></div><select aria-label="Estado de campaña" onchange="db.campaigns[${i}].status=this.value;save('Campaña actualizada',db.campaigns[${i}].name);render()">${opts(['Programada','Activa','Suspendida','Finalizada'],c.status)}</select></div>`).join('')}<p class="mini">La bitácora y los indicadores mostrados corresponden al expediente HT-C01.</p></section><section class="panel"><h2>Aeronaves y tripulaciones asignadas</h2>${[['ZP-H01','Juan Pérez · Piloto','Carlos Díaz · Mecánico'],['ZP-H03','Ana Torres · Piloto','Luis Núñez · Mecánico']].map(a=>`<div class="flightline">${icon('plane')}<div><b>${a[0]}</b><br><small>${a[1]}<br>${a[2]}<br>Base Chaco · 01 – 30 noviembre</small></div>${pill('Disponible')}</div>`).join('')}<p class="mini">Matrículas, tripulaciones y bases ficticias.</p></section></div>`:`<section class="panel"><div class="panelhead"><h2>Documentación del expediente HT-C01</h2></div>${table(['Documento','Tipo','Estado','Acción'],[['Contrato de campaña','Contrato'],['Presupuesto operativo','Presupuesto'],['Parte diario de operaciones','Informe']].map((a,i)=>row([a[0],a[1],pill('Ejemplo'),button('Vista previa',`documentPreview(${i})`,'small')])))}<p class="mini">Archivos de ejemplo generados dentro de la demo.</p></section>`}`}
function documentPreview(i){showModal(`<div class="eyebrow">Helitáctica · Expediente HT-C01</div><h2>${['Contrato de campaña','Presupuesto operativo','Parte diario de operaciones'][i]}</h2><p class="permission">Documento ilustrativo de la campaña Protección forestal · Chaco 2026.</p><p>Cliente: Agroforestal del Norte<br>Período: 01 al 30 de noviembre de 2026<br>Base operativa: Chaco<br>Aeronaves: ZP-H01 / ZP-H03</p><p class="mini">Esta vista demuestra la organización de documentos del expediente. No constituye un contrato ni un registro aeronáutico real.</p>${button('Cerrar','closeModal()')}`)}
function reports(){let ds=filter(db.deals),won=ds.filter(d=>d.stage==='Ganada'),lost=ds.filter(d=>['Perdida','Cancelada'].includes(d.stage));return head('Informes y metas','Información comercial y operativa para decidir con claridad.',button('Guardar como PDF','window.print()','','download'))+toolbar()+`<div class="cards">${card('Oportunidades',ds.length,'Filtradas por servicio y perfil','users')}${card('Conversión a venta',Math.round(won.length/Math.max(1,ds.length)*100)+'%','Ganadas / oportunidades','pipeline')}${card('Ventas perdidas',money(lost.reduce((a,d)=>a+d.amount,0)),lost.length+' cierres sin venta','chart')}${card('Facturación',money(mine(db.quotes).filter(q=>q.invoiced&&(service==='Todos los servicios'||db.clients.find(c=>c.name===q.client)?.service===service)).reduce((a,q)=>a+q.amount,0)),'Facturas externas registradas','doc',true)}</div><section class="panel" style="margin-bottom:22px"><div class="panelhead"><h2>Desempeño y cumplimiento de metas</h2><span class="mini">Meta ilustrativa por asesor: USD 40.000</span></div>${sellerTable()}</section><div class="reportcards">${[['comercial','Resumen comercial','Oportunidades, importes, estados y responsables.'],['cotizaciones','Cotizaciones y facturación','Propuestas, versiones y facturas externas registradas.'],['incendios','Operaciones de incendios','Vuelos, distancias, descargas y litros por registro.'],['seguimientos','Seguimientos pendientes','Tareas, fechas, responsables y estado.'],['comisiones','Comisiones comerciales','Escenario ilustrativo: 3% de ventas ganadas.'],['auditoria','Historial de actividad','Acciones realizadas en esta demostración.']].filter(x=>role==='Gerencia Comercial'||!['incendios','auditoria'].includes(x[0])).map(x=>`<section class="reportcard">${icon(x[0]==='incendios'?'fire':'doc')}<h3>${x[1]}</h3><p>${x[2]}</p>${button('Descargar CSV',`exportData('${x[0]}')`,'small','download')}${x[0]==='comisiones'?`<p>Total estimado: <b>${money(mine(db.deals).filter(d=>d.stage==='Ganada').reduce((a,d)=>a+d.amount*.03,0))}</b></p>`:''}</section>`).join('')}</div><div class="permission">Los gráficos de tendencia y distribución son ilustrativos. Los importes, cierres, metas e indicadores operativos se recalculan desde los registros de la demo. Las reglas finales de comisiones y tiempos de respuesta quedan pendientes de definición.</div>`}
function security(){if(role!=='Gerencia Comercial')return head('Mi perfil y permisos','Vista de asesor comercial')+`<section class="panel">${person(role,'Asesor comercial')}<div class="permission">Acceso de demostración limitado a tus registros asignados. La seguridad real requiere autenticación y controles en servidor.</div><p class="sub">Podés responder conversaciones, preparar cotizaciones y registrar seguimientos. Las modificaciones de facturación requieren aprobación gerencial.</p></section>`;return head('Seguridad y auditoría','Visibilidad de accesos, responsables e historial de cambios.',button('Exportar auditoría',"exportData('auditoria')",'','download'))+`<div class="twocol"><section class="panel"><h2>Accesos y perfiles</h2>${table(['Usuario','Perfil','Alcance'],[row([person('Gerencia Comercial'),'Gerente','Supervisión global']),...sellers.map(s=>row([person(s),'Vendedor','Registros asignados']))])}<p class="mini">El selector superior permite recorrer la experiencia de cada perfil. No representa un inicio de sesión real.</p></section><section class="panel"><h2>Diseño de protección de datos</h2>${[['Propiedad de la información','Helitáctica Aviación'],['Autenticación y roles','Previstos para la implementación'],['Respaldos y recuperación','Pendientes de infraestructura real'],['Auditoría inmutable','Requiere almacenamiento protegido en servidor']].map(a=>`<div class="feedrow">${icon('shield')}<div><b>${a[0]}</b><small>${a[1]}</small></div></div>`).join('')}</section></div><section class="panel" style="margin-top:22px"><div class="panelhead"><h2>Bitácora de la demostración</h2><span class="pill">Registro local</span></div>${table(['Hora','Responsable','Acción','Detalle'],db.audit.map(a=>row([esc(a.time),esc(a.user),esc(a.action),esc(a.detail)])))}</section><section class="panel" style="margin-top:22px"><h2>Recorrido de presentación</h2>${[['Base del CRM y WhatsApp','Simulá una consulta, asignala a Cristian, respondé y transferila a Claudia.'],['Oportunidades y ventas','Creá una oportunidad, avanzala hasta Ganada y revisá los resultados.'],['Panel e informes','Revisá metas, exportá los registros o guardá el panel como PDF.'],['Combate de incendios','Registrá un vuelo y comprobá los cambios en horas, descargas y litros.']].map((a,i)=>`<div class="step"><span class="stepnum">0${i+1}</span><div><b>${a[0]}</b><p>${a[1]}</p></div></div>`).join('')}<div style="margin-top:20px">${button('Restablecer datos de ejemplo',"resetDemo()",'small')}</div></section>`}
function showModal(html){document.querySelector('#overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="Formulario de demostración">${html}</section></div>`;document.querySelector('.modal input,.modal select,.modal button')?.focus()}function closeModal(){document.querySelector('#overlay').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function field(label,name,type='text',values=[],val='',full=false){return `<div class="field ${full?'full':''}"><label for="f-${name}">${label}</label>${type==='select'?`<select id="f-${name}" name="${name}">${opts(values,val)}</select>`:`<input id="f-${name}" name="${name}" type="${type}" value="${esc(val)}" ${type==='number'?'min="0" step="any"':''} required>`}</div>`}
function modal(type){const sellerfield=field('Asesor responsable','seller','select',role==='Gerencia Comercial'?sellers:[role]),clients=mine(db.clients).map(c=>c.name);let titles={client:'Nuevo cliente',deal:'Nueva oportunidad',quote:'Nueva cotización',task:'Programar seguimiento',campaign:'Nueva campaña',flight:'Registrar operación aérea'};let fields='';if(type==='client')fields=field('Cliente / empresa','name')+field('Persona de contacto','contact')+field('Correo electrónico','email','email')+field('Servicio','service','select',services)+sellerfield;
if(type==='deal')fields=field('Nombre de la oportunidad','name')+field('Cliente','client','select',clients)+field('Servicio','service','select',services)+field('Importe cotizado (USD)','amount','number',[],1000)+sellerfield+field('Aeronave','aircraft','select',['ZP-H01','ZP-H02','ZP-H03','Por definir']);
if(type==='quote')fields=field('Cliente','client','select',clients)+field('Importe (USD)','amount','number',[],1000)+sellerfield+field('Versión','version','number',[],1);
if(type==='task')fields=field('Acción a realizar','name')+field('Cliente','client','select',clients)+sellerfield+field('Fecha de seguimiento','date','date',[],'2026-11-09');
if(type==='campaign')fields=field('Nombre de campaña','name')+field('Cliente','client','select',db.clients.map(c=>c.name))+field('Ubicación','location')+field('Estado','status','select',['Programada','Activa','Suspendida','Finalizada'])+field('Inicio','start','date',[],'2026-11-09')+field('Finalización','end','date',[],'2026-11-30');
if(type==='flight')fields=`<div class="field full"><label>Expediente</label><input value="HT-C01 · Protección forestal · Chaco 2026" readonly></div>`+field('Fecha','date','date',[],'2026-11-08')+field('Aeronave','aircraft','select',['ZP-H01','ZP-H03'])+field('Piloto','pilot','select',['Juan Pérez','Ana Torres'])+field('Actividad','activity','select',['Combate','Patrullaje','Verificación','Prueba','Guardia sin vuelo'])+field('Hora de inicio','start','time',[],'08:00')+field('Hora de fin','end','time',[],'09:00')+field('Distancia (NM)','distance','number',[],45)+field('Zona / base','zone','text',[],'Sector Norte')+field('Cantidad de descargas','drops','number',[],3)+field('Litros por descarga','perdrop','number',[],1000)+`<div class="field full"><label for="f-observations">Observaciones</label><textarea id="f-observations" name="observations" placeholder="Incidencias o resultados de la misión"></textarea></div><p class="mini">Las horas de vuelo y el trabajo fuera de guardia (07:00–18:00) se calculan automáticamente. Esta demo usa igual volumen por descarga.</p>`;
showModal(`<div class="eyebrow">Nuevo registro / Demostración</div><h2>${titles[type]}</h2><p class="sub">Los cambios se guardan en este navegador.</p><form onsubmit="submitForm(event,'${type}')"><div class="formgrid">${fields}</div><div class="actions"><button class="btn primary" type="submit">Guardar registro</button><button class="btn" type="button" onclick="closeModal()">Cancelar</button></div></form>`)}
function submitForm(e,type){e.preventDefault();let data=Object.fromEntries(new FormData(e.target));if(type==='client'){if(db.clients.some(c=>c.email.toLowerCase()===data.email.toLowerCase()))return toast('Ya existe un cliente con ese correo');db.clients.push(data)}if(type==='deal'){data.amount=Number(data.amount);data.stage='Nueva';db.deals.push(data)}if(type==='quote'){data.amount=Number(data.amount);data.version=Number(data.version);data.number='HT-2026-'+String(96+db.quotes.length-3).padStart(4,'0');data.status='Enviada';db.quotes.push(data)}if(type==='task'){data.done=false;db.tasks.push(data)}if(type==='campaign'){if(data.end<data.start)return toast('La fecha final debe ser posterior al inicio');db.campaigns.push(data);firetab='Recursos y campañas'}if(type==='flight'){let mins=t=>Number(t.split(':')[0])*60+Number(t.split(':')[1]),start=mins(data.start),end=mins(data.end);data.mins=data.activity==='Guardia sin vuelo'?0:(end-start+1440)%1440;if(data.activity!=='Guardia sin vuelo'&&!data.mins)return toast('Revisá los horarios de la misión');data.outside=start<420||end>1080||end<start;data.distance=data.activity==='Guardia sin vuelo'?0:Number(data.distance);data.drops=data.activity==='Combate'?Number(data.drops):0;if(!Number.isInteger(data.drops))return toast('La cantidad de descargas debe ser entera');data.liters=data.drops*Number(data.perdrop);db.flights.push(data);firetab='Resumen'}save('Registro creado',type==='flight'?data.aircraft+' · '+data.activity:data.name||data.number||data.client);closeModal();render();toast('Registro guardado. Indicadores actualizados.')}
function exportData(kind){let data=kind==='incendios'?db.flights:kind==='auditoria'?db.audit:kind==='cotizaciones'?mine(db.quotes):kind==='seguimientos'?mine(db.tasks):kind==='comisiones'?sellers.filter(s=>role==='Gerencia Comercial'||role===s).map(s=>({vendedor:s,ventas_ganadas:db.deals.filter(d=>d.seller===s&&d.stage==='Ganada').reduce((a,d)=>a+d.amount,0),comision_demo_3_por_ciento:db.deals.filter(d=>d.seller===s&&d.stage==='Ganada').reduce((a,d)=>a+d.amount*.03,0)})):filter(db.deals);if(!data.length)return toast('No hay registros para exportar');const headers=[...new Set(data.flatMap(Object.keys))];let csv='\ufeff'+[headers,...data.map(d=>headers.map(h=>d[h]??''))].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='Helitactica_'+kind+'_demo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('CSV exportado · Compatible con Excel')}
function resetDemo(){showModal(`<h2>Restablecer demostración</h2><p class="sub">Se eliminarán únicamente los cambios de esta demo en este navegador.</p><div class="actions">${button('Restablecer',"db=structuredClone(initial);localStorage.removeItem('helitactica-demo-v1');closeModal();render();toast('Datos de ejemplo restaurados')",'primary')}${button('Cancelar','closeModal()')}</div>`)}
function render(){document.querySelector('#nav').innerHTML=navs.filter(n=>role==='Gerencia Comercial'||n[0]!=='fire').map((n,i)=>`${i===6?'<div class="navlabel">OPERACIONES Y CONTROL</div>':''}<button class="${view===n[0]?'active':''}" onclick="go('${n[0]}')">${icon(n[2])}${n[1]}${n[0]==='inbox'?`<span class="count">${mine(db.chats).length}</span>`:''}</button>`).join('');document.querySelector('#breadcrumb').textContent=navs.find(n=>n[0]===view)?.[1];const fn={dashboard,inbox,clients,pipeline,quotes,tasks,fire,reports,security};document.querySelector('#app').innerHTML=(fn[view]||dashboard)()+`<footer><span>HELITÁCTICA AVIACIÓN · CENTRO DE CONTROL</span><span>Demo visual por NovaTec · Datos ficticios</span></footer>`;document.querySelector('#useravatar').textContent=initials(role)}
document.querySelector('#role').onchange=e=>{role=e.target.value;search='';service='Todos los servicios';if(view==='fire'&&role!=='Gerencia Comercial')view='dashboard';render();toast('Vista de demostración: '+role)};render();
</script></body></html>
